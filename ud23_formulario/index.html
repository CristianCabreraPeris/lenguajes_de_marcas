<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de alta de usuario</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <h1>Formulario de alta de usuario</h1>

  <form action="#" method="post" enctype="multipart/form-data">
    <table>
      <tr>
        <td colspan="2" class="centrado">
          <label for="usuario">Identificador de nuevo usuario</label>
          <input type="text" id="usuario" name="usuario" value="usu_012345" readonly
                 title="Identificador asignado automáticamente; no se puede modificar">
        </td>
      </tr>
      <tr>
        <td>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" title="Escriba su nombre">
        </td>
        <td>
          <label for="apellidos">Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos" title="Escriba sus apellidos">
        </td>
      </tr>
      <tr>
        <td>
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" title="Elija una contraseña">
        </td>
        <td>
          <label for="password2">Confirmar contraseña:</label>
          <input type="password" id="password2" name="password2" title="Repita la contraseña para confirmarla">
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <label for="email">Email:</label>
          <input type="text" id="email" name="email" class="ancho" title="Escriba su dirección de correo electrónico">
        </td>
      </tr>
      <tr>
        <td><span class="etiqueta">Sexo:</span></td>
        <td>
          <input type="radio" id="hombre" name="sexo" value="hombre" title="Seleccione si es hombre">
          <label for="hombre" class="normal">Hombre</label>
          <input type="radio" id="mujer" name="sexo" value="mujer" checked title="Seleccione si es mujer">
          <label for="mujer" class="normal">Mujer</label>
        </td>
      </tr>
      <tr>
        <td><span class="etiqueta">Aficiones:</span></td>
        <td>
          <input type="checkbox" id="deporte" name="aficiones" value="deporte" title="Marque si le gusta el deporte">
          <label for="deporte" class="normal">Deportes</label><br>
          <input type="checkbox" id="lectura" name="aficiones" value="lectura" checked title="Marque si le gusta la lectura">
          <label for="lectura" class="normal">Lectura</label><br>
          <input type="checkbox" id="cine" name="aficiones" value="cine" title="Marque si le gusta el cine">
          <label for="cine" class="normal">Cine</label>
        </td>
      </tr>
      <tr>
        <td><label for="pais">País:</label></td>
        <td>
          <select id="pais" name="pais" title="Seleccione su país de residencia">
            <option value="espana" selected>España</option>
            <option value="francia">Francia</option>
            <option value="portugal">Portugal</option>
          </select>
        </td>
      </tr>
      <tr>
        <td><label for="foto">Subir su foto:</label></td>
        <td>
          <input type="file" id="foto" name="foto" title="Seleccione un archivo con su fotografía">
        </td>
      </tr>
      <tr>
        <td><label for="comentarios">Comentarios personales:</label></td>
        <td>
          <textarea id="comentarios" name="comentarios" cols="40" rows="5"
                    placeholder="Escriba aquí sus comentarios"
                    title="Escriba aquí cualquier comentario personal"></textarea>
        </td>
      </tr>
      <tr>
        <td class="centrado">
          <input type="reset" value="Resetear" title="Borra todos los datos y deja el formulario como al principio">
        </td>
        <td class="centrado">
          <input type="submit" value="Enviar" title="Envía el formulario">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
