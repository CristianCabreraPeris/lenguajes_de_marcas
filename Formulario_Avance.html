<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
    <!--Avance de formulario-->
    <h1>Formulario de alta de usuario</h1>

    <form method="post" action="#" >
     <label> Identificador de nuevo usuario: </label><input type="text" readonly value="usu_012345" name="Identificador">
     <br><br>
     <label>Nombre: </label><input type="text" name="Nombre">
     <br><br>
     <label>Apellidos: </label><input type="text" name="Apellidos">
     <br><br>
     <label>Contraseña: </label><input type="password" name="Contraseña">
     <br><br>
     <label>Confirmar contraseña: </label><input type="password" name="confirmarContraseña">
     <br><br>
     <label>Email: </label><input type="text" name="email">
    <br><br>
    <label>Sexo: </label>
    <input type="radio" name="Sexo" option="Hombre" value="Mujer">
    <input type="radio" name="Sexo" option="Mujer" value="Mujer">
    </form>









</body>
</html>
